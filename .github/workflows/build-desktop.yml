name: Build Desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm install
      - name: Build app
        run: npm run build
      - name: Package installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: deep-messenger-desktop-win
          path: |
            desktop/release/*.exe
            desktop/release/*.msi
