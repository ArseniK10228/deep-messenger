name: Deploy Deep Messenger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "infra/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-deep-messenger
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
              - 'scripts/infra/**'

  deploy:
    needs: changes
    runs-on: ubuntu-latest
    env:
      SSH_KEY_FILE: /home/runner/.ssh/vps_deploy_key
      EXPECTED_DEPLOY_PUBKEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA2wDQHc8nJInmTGwEDQklnRelm3nG5gxBxTXjTMS0eN

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Secret VPS_SSH_KEY is empty"
            exit 1
          fi
          install -m 700 -d /home/runner/.ssh
          KEY_RAW=$(echo "$VPS_SSH_KEY" | tr -d '\r')
          if echo "$KEY_RAW" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            echo "$KEY_RAW" > "$SSH_KEY_FILE"
          else
            BODY=$(echo "$KEY_RAW" | tr -d ' \n')
            { echo '-----BEGIN OPENSSH PRIVATE KEY-----'; echo "$BODY" | fold -w 70; echo '-----END OPENSSH PRIVATE KEY-----'; } > "$SSH_KEY_FILE"
          fi
          chmod 600 "$SSH_KEY_FILE"
          ACTUAL_PUB=$(ssh-keygen -y -f "$SSH_KEY_FILE" | awk '{print $1" "$2}')
          if [ "$ACTUAL_PUB" != "$EXPECTED_DEPLOY_PUBKEY" ]; then
            echo "::error::VPS_SSH_KEY fingerprint mismatch"
            exit 1
          fi

      - name: Preflight VPS + home SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$SSH_KEY_FILE" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "${VPS_USER}@${VPS_HOST}" \
            'ssh -i /root/.ssh/home_deploy -o BatchMode=yes -o ConnectTimeout=20 root@100.118.211.24 echo HOME_OK'

      - name: Create deploy bundle
        run: |
          tar czf /tmp/deep-deploy.tgz \
            --exclude='./android' \
            --exclude='./.git' \
            server infra scripts docker-compose.yml .env.example

      - name: Upload deploy bundle to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i "$SSH_KEY_FILE" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            /tmp/deep-deploy.tgz "${VPS_USER}@${VPS_HOST}:/tmp/deep-deploy.tgz"
          ssh -i "$SSH_KEY_FILE" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            "${VPS_USER}@${VPS_HOST}" \
            'rm -rf /tmp/deep-messenger && mkdir -p /tmp/deep-messenger && tar xzf /tmp/deep-deploy.tgz -C /tmp/deep-messenger'

      - name: Deploy to home (VPS → Tailscale)
        uses: appleboy/ssh-action@v1.2.0
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_GATEWAY_TOKEN: ${{ secrets.TELEGRAM_GATEWAY_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          envs: FIREBASE_JSON,TELEGRAM_GATEWAY_TOKEN,RESEND_API_KEY,JWT_SECRET
          script: |
            set -euxo pipefail
            K=/root/.ssh/home_deploy
            O="-o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=30"
            ssh -i "$K" $O root@100.118.211.24 'test -f /opt/deep-messenger/.env && cp /opt/deep-messenger/.env /tmp/deep-messenger.env.bak || true'
            ssh -i "$K" $O root@100.118.211.24 'test -d /opt/deep-messenger/secrets && cp -a /opt/deep-messenger/secrets /tmp/deep-messenger-secrets.bak || true'
            ssh -i "$K" $O root@100.118.211.24 'mkdir -p /opt/deep-messenger'
            rsync -a --delete \
              --exclude '.env' \
              --exclude 'secrets/' \
              --exclude 'server/app-release.json' \
              -e "ssh -i $K $O" /tmp/deep-messenger/ root@100.118.211.24:/opt/deep-messenger/
            ssh -i "$K" $O root@100.118.211.24 'test -f /tmp/deep-messenger.env.bak && cp /tmp/deep-messenger.env.bak /opt/deep-messenger/.env || true'
            ssh -i "$K" $O root@100.118.211.24 'test -d /tmp/deep-messenger-secrets.bak && cp -a /tmp/deep-messenger-secrets.bak /opt/deep-messenger/secrets || true'
            if [ -n "${FIREBASE_JSON:-}" ]; then
              printf '%s' "$FIREBASE_JSON" > /tmp/firebase-sa.json
              ssh -i "$K" $O root@100.118.211.24 'mkdir -p /opt/deep-messenger/secrets'
              scp -i "$K" $O /tmp/firebase-sa.json root@100.118.211.24:/opt/deep-messenger/secrets/firebase-service-account.json
              rm -f /tmp/firebase-sa.json
            fi
            ssh -i "$K" $O root@100.118.211.24 "JWT_SECRET='${JWT_SECRET:-}' bash /opt/deep-messenger/scripts/infra/apply-home.sh"
            if [ -n "${TELEGRAM_GATEWAY_TOKEN:-}" ]; then
              ssh -i "$K" $O root@100.118.211.24 "touch /opt/deep-messenger/.env; grep -q '^TELEGRAM_GATEWAY_TOKEN=' /opt/deep-messenger/.env && sed -i 's|^TELEGRAM_GATEWAY_TOKEN=.*|TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN}|' /opt/deep-messenger/.env || echo TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN} >> /opt/deep-messenger/.env; systemctl restart deep-messenger"
            fi
            if [ -n "${RESEND_API_KEY:-}" ]; then
              ssh -i "$K" $O root@100.118.211.24 "touch /opt/deep-messenger/.env; grep -q '^RESEND_API_KEY=' /opt/deep-messenger/.env && sed -i 's|^RESEND_API_KEY=.*|RESEND_API_KEY=${RESEND_API_KEY}|' /opt/deep-messenger/.env || echo RESEND_API_KEY=${RESEND_API_KEY} >> /opt/deep-messenger/.env; grep -q '^RESEND_FROM=' /opt/deep-messenger/.env && sed -i 's|^RESEND_FROM=.*|RESEND_FROM=noreply@deepdesignpc.online|' /opt/deep-messenger/.env || echo RESEND_FROM=noreply@deepdesignpc.online >> /opt/deep-messenger/.env; systemctl restart deep-messenger"
            fi

      - name: Apply VPS nginx
        if: needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euxo pipefail
            REPO=/tmp/deep-messenger
            bash "$REPO/scripts/infra/apply-vps.sh"
            if [[ -f "$REPO/scripts/infra/apply-vps-turn.sh" ]]; then
              bash "$REPO/scripts/infra/apply-vps-turn.sh" || echo "WARN: coturn apply failed (DNS/firewall?)"
            fi
            if [[ -f "$REPO/scripts/infra/sync-turn-secret.sh" ]]; then
              bash "$REPO/scripts/infra/sync-turn-secret.sh" || echo "WARN: TURN secret sync failed"
            fi

      - name: Smoke test
        run: |
          set -eu
          ok=0
          for i in $(seq 1 8); do
            if curl -fsS --max-time 10 https://api.deepdesignpc.online/health | grep -q '"ok":true'; then
              ok=1
              break
            fi
            echo "waiting api health ($i/8)..."
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::api health failed"
            exit 1
          fi
          curl -fsS --max-time 15 https://deepdesignpc.online/ >/dev/null
          curl -fsS --max-time 15 https://api.deepdesignpc.online/api/v1/app/release | grep -q '"versionCode"'
          echo "Smoke OK"
