# VPS — deepdesignpc.online + api.deepdesignpc.online → дом :3002

upstream deep_messenger_home {
    server 100.118.211.24:3002 max_fails=2 fail_timeout=15s;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.deepdesignpc.online;

    ssl_certificate /etc/letsencrypt/live/deepdesignpc.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepdesignpc.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 55m;

    location /ws {
        proxy_pass http://deep_messenger_home;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://deep_messenger_home;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.deepdesignpc.online;
    return 301 https://$host$request_uri;
}

# Лендинг / скачивание APK (статика на VPS или редирект)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deepdesignpc.online;

    ssl_certificate /etc/letsencrypt/live/deepdesignpc.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepdesignpc.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/deep-messenger;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name deepdesignpc.online;
    return 301 https://$host$request_uri;
}
