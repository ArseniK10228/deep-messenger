name: Build Desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm install
      - name: Build app
        run: npm run build
      - name: Package installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: deep-messenger-desktop-win
          path: |
            desktop/release/*.exe
            desktop/release/*.msi

      - name: Attach Windows installer to downloads release
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SETUP=$(find desktop/release -maxdepth 1 -name '*.exe' -print | head -1)
          if [ -z "$SETUP" ]; then
            echo "::error::No Windows installer in desktop/release"
            exit 1
          fi
          VER=$(node -p "require('./desktop/package.json').version")
          gh release view downloads --repo "${{ github.repository }}" 2>/dev/null || gh release create downloads \
            --repo "${{ github.repository }}" \
            --title "Установка Deep Messenger" \
            --notes "Актуальные сборки Android и Windows. Файлы обновляются при CI." \
            --latest
          YML=desktop/release/latest.yml
          if [ ! -f "$YML" ]; then
            echo "::error::Missing latest.yml for electron-updater (OTA)"
            exit 1
          fi
          cp "$SETUP" "Deep-Messenger-Windows-Setup-${VER}.exe"
          cp "$SETUP" Deep-Messenger-Windows-Setup-latest.exe
          gh release upload downloads \
            "Deep-Messenger-Windows-Setup-${VER}.exe" \
            Deep-Messenger-Windows-Setup-latest.exe \
            "$YML" \
            --clobber \
            --repo "${{ github.repository }}"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/downloads"
