# coturn on VPS — relay for WebRTC (no home router UDP)
# Set TURN_SECRET in /etc/turnserver.conf and server .env on home

listening-port=3478
tls-listening-port=5349

listening-ip=0.0.0.0
relay-ip=0.0.0.0

fingerprint
lt-cred-mech
use-auth-secret
# Replace at deploy: openssl rand -hex 32
static-auth-secret=CHANGE_ME_TURN_SECRET

realm=deepdesignpc.online
server-name=turn.deepdesignpc.online

no-multicast-peers
no-cli
no-loopback-peers

min-port=49152
max-port=65535

log-file=/var/log/turnserver/turnserver.log
verbose

# Uncomment when cert exists for TURNS:
# cert=/etc/letsencrypt/live/deepdesignpc.online/fullchain.pem
# pkey=/etc/letsencrypt/live/deepdesignpc.online/privkey.pem
