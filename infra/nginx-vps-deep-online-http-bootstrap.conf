# Temporary HTTP-only bootstrap until DNS points here and certbot runs.
# After SSL: replace with nginx-vps-deep-online.conf via apply-vps.sh

upstream deep_messenger_home {
    server 100.118.211.24:3002 max_fails=2 fail_timeout=15s;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.deepdesignpc.online;

    client_max_body_size 55m;

    location /ws {
        proxy_pass http://deep_messenger_home;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://deep_messenger_home;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name deepdesignpc.online;

    root /var/www/deep-messenger;
    index index.html;

    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="deep.apk"';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
