<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep</title>
  <style>
    :root { --bg: #0d0d0f; --accent: #9d5cff; --text: #fff; --muted: #8e8e93; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
    }
    .card { text-align: center; padding: 2rem; max-width: 420px; }
    h1 { font-size: 3rem; margin: 0; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); line-height: 1.5; }
    a {
      display: inline-block; margin-top: 1.5rem; padding: .85rem 1.4rem;
      background: var(--accent); color: #fff; text-decoration: none; border-radius: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Deep<span>.</span></h1>
    <p>Личный мессенджер. Скачай APK и войди по номеру телефона.</p>
    <a href="/deep.apk">Скачать APK</a>
  </div>
</body>
</html>
