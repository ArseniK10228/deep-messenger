name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Only publish release metadata (APK already on VPS)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "android/**"
      - "server/app-release.json"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SSH_KEY_FILE: /home/runner/.ssh/vps_deploy_key
      EXPECTED_DEPLOY_PUBKEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFP1VPZssMLz++UJ0GrnnobQrhKuGg8FMmhCVGE9Zbbr

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android signing keystore
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_B64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > android/app/ci-debug.keystore
            echo "Using CI debug keystore (matches local Android Studio installs)"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 not set — APK signature may differ from local builds"
          fi

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES" ]; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON secret is required for APK build"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES" > android/app/google-services.json

      - name: Sync app-release.json from Gradle
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_only }}
        run: |
          VC=$(grep -E 'versionCode\s*=' android/app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          VN=$(grep -E 'versionName\s*=' android/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          export VC VN
          node -e "
            const fs = require('fs');
            const p = 'server/app-release.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.versionCode = Number(process.env.VC);
            j.versionName = process.env.VN;
            if (!j.versionCode || !j.versionName) {
              console.error('Invalid version from Gradle:', process.env.VC, process.env.VN);
              process.exit(1);
            }
            j.changelog = 'Доступно обновление приложения.';
            j.forceUpdate = j.forceUpdate === true;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          echo "Release metadata: versionCode=$VC versionName=$VN"
          cat server/app-release.json

      - name: Cache Gradle
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_only }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Ensure Gradle wrapper
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_only }}
        run: |
          cd android
          if [ ! -f gradlew ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gradle
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Assemble debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_only }}
        env:
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: androiddebugkey
          ANDROID_KEY_PASSWORD: android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_only }}
        uses: actions/upload-artifact@v4
        with:
          name: deep-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Attach APK to downloads release
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          test -n "$APK"
          VN=$(grep -E 'versionName\s*=' android/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          gh release view downloads 2>/dev/null || gh release create downloads \
            --title "Установка Deep Messenger" \
            --notes "Актуальные сборки Android и Windows. Файлы обновляются при CI." \
            --latest
          cp "$APK" "Deep-Messenger-Android-${VN}.apk"
          cp "$APK" Deep-Messenger-Android-latest.apk
          gh release upload downloads \
            "Deep-Messenger-Android-${VN}.apk" \
            Deep-Messenger-Android-latest.apk \
            --clobber
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/downloads"

      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d /home/runner/.ssh
          KEY_RAW=$(echo "$VPS_SSH_KEY" | tr -d '\r')
          if echo "$KEY_RAW" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            echo "$KEY_RAW" > "$SSH_KEY_FILE"
          else
            BODY=$(echo "$KEY_RAW" | tr -d ' \n')
            { echo '-----BEGIN OPENSSH PRIVATE KEY-----'; echo "$BODY" | fold -w 70; echo '-----END OPENSSH PRIVATE KEY-----'; } > "$SSH_KEY_FILE"
          fi
          chmod 600 "$SSH_KEY_FILE"

      - name: Publish APK to VPS
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_only }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          test -n "$APK"
          ssh -i "$SSH_KEY_FILE" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            "${VPS_USER}@${VPS_HOST}" 'mkdir -p /var/www/deep-messenger'
          scp -i "$SSH_KEY_FILE" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=60 \
            "$APK" "${VPS_USER}@${VPS_HOST}:/var/www/deep-messenger/deep.apk"
          ssh -i "$SSH_KEY_FILE" -o StrictHostKeyChecking=accept-new \
            "${VPS_USER}@${VPS_HOST}" 'chmod 644 /var/www/deep-messenger/deep.apk && ls -lh /var/www/deep-messenger/deep.apk'

      - name: Smoke test OTA endpoints
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_only }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          if curl -fsS --max-time 20 https://deepdesignpc.online/deep.apk -o /tmp/deep.apk 2>/dev/null; then
            test -s /tmp/deep.apk
            ls -lh /tmp/deep.apk
            echo "APK download OK (public HTTPS)"
          else
            echo "Public HTTPS not ready — verify APK on VPS via SSH"
            SIZE=$(ssh -i "$SSH_KEY_FILE" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
              "${VPS_USER}@${VPS_HOST}" "stat -c%s /var/www/deep-messenger/deep.apk")
            test "$SIZE" -ge 500000
            echo "APK OK on VPS: $SIZE bytes"
          fi

      - name: Publish release metadata to API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          chmod +x scripts/infra/publish-app-release.sh
          bash scripts/infra/publish-app-release.sh
